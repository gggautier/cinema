name: Séances du jour

on:
  schedule:
    - cron: "0 5 * * *"
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: showtimes

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Déjà à jour ?
        id: gate
        run: |
          today=$(TZ=Europe/Paris date +%F)
          hour=$(TZ=Europe/Paris date +%H)
          have=$(python3 -c "import json;print(json.load(open('data/showtimes.json')).get('date',''))" 2>/dev/null || true)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$have" != "$today" ] && [ "$hour" -ge 7 ]; }; then
            echo "run=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == '1'
        with:
          python-version: "3.12"
          cache: pip

      - if: steps.gate.outputs.run == '1'
        run: pip install -r requirements.txt

      - name: Récupérer les séances
        if: steps.gate.outputs.run == '1'
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/fetch_showtimes.py

      - name: Commit
        if: steps.gate.outputs.run == '1'
        run: |
          git config user.name "showtimes-bot"
          git config user.email "showtimes-bot@users.noreply.github.com"
          git add data/showtimes.json data/id-map.json
          git diff --cached --quiet || git commit -m "Séances du $(TZ=Europe/Paris date +%F)"
          git push
